<svg width="320" height="220" viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Axes -->
  <line x1="40" y1="180" x2="280" y2="180" stroke="#888" stroke-width="1"/>
  <line x1="160" y1="180" x2="160" y2="40" stroke="#888" stroke-width="1"/>
  <!-- Original vector (blue) -->
  <line x1="160" y1="180" x2="240" y2="100" stroke="#1f77b4" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="245" y="95" font-size="14" fill="#1f77b4">x</text>
  <!-- Rotated vector (red, 45deg) -->
  <line x1="160" y1="180" x2="216" y2="124" stroke="#d62728" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="220" y="120" font-size="14" fill="#d62728">RoPE(x)</text>
  <!-- Angle arc (theta) -->
  <path d="M200 140 A56 56 0 0 1 216 124" fill="none" stroke="#2ca02c" stroke-width="2"/>
  <text x="208" y="135" font-size="13" fill="#2ca02c">θ</text>
  <!-- Origin dot -->
  <circle cx="160" cy="180" r="4" fill="#444"/>
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <!-- Axis labels -->
  <text x="275" y="195" font-size="12" fill="#888">x₁</text>
  <text x="145" y="50" font-size="12" fill="#888">x₂</text>
</svg>